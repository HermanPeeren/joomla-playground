name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Joomla release the integration tests install; keep in line with phpunit.xml.dist
  JOOMLA_VERSION: 6.2.0

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.driver }}, ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # playgroundsqlite: Joomla's PostgreSQL schema on SQLite; mysqlonsqlite: MySQL emulated on SQLite (spike)
        driver: [playgroundsqlite, mysqlonsqlite]
        runtime: [native]
        include:
          # The site served and the CLI run by PHP 8.4 compiled to WebAssembly (@php-wasm/node)
          - { php: '8.3', driver: playgroundsqlite, runtime: wasm }
          - { php: '8.3', driver: mysqlonsqlite, runtime: wasm }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, zip, gd, intl, mbstring
          coverage: none

      - name: Cache the Joomla package
        uses: actions/cache@v4
        with:
          path: .cache
          key: joomla-${{ env.JOOMLA_VERSION }}

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'wasm'
        with:
          node-version: 24

      - run: composer install --no-interaction --no-progress

      - run: npm ci --no-audit --no-fund
        if: matrix.runtime == 'wasm'

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Integration tests (Joomla on SQLite)
        run: vendor/bin/phpunit --testsuite integration
        env:
          JOOMLA_TEST_DRIVER: ${{ matrix.driver }}
          JOOMLA_TEST_RUNTIME: ${{ matrix.runtime }}

      - name: PHP server log
        if: failure()
        run: cat build/php-server.log || true
