name: Deploy the playground

# Publishes web/dist to GitHub Pages. Pages must be enabled with "GitHub Actions" as source
# (Settings > Pages) before this workflow can deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, gd, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund

      # One bundle per Joomla version in joomla-versions.json; the packages are downloaded from GitHub releases.
      - name: Build the Joomla bundles and the playground
        run: |
          npm run bundle
          npm run web:build
        env:
          # The deployed CORS proxy, if any (Settings > Secrets and variables > Actions > Variables), as a URL
          # prefix, e.g. https://joomla-playground-cors-proxy.<account>.workers.dev/?url=
          VITE_CORS_PROXY: ${{ vars.CORS_PROXY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
