<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joomla Playground</title>
  <style>
    :root {
      --bar: #1c2b4a;
      --bar-text: #f2f5fa;
      --muted: #b9c4d8;
      --accent: #f9a541;
      --error: #ff8a80;
      --page: #ffffff;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 8px 16px;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    header button {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: transparent;
      color: var(--bar-text);
      font: inherit;
      cursor: pointer;
    }

    header button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status { color: var(--accent); }
    #status.error { color: var(--error); white-space: pre-wrap; }
    #info, #credentials-label, #php-label { color: var(--muted); }

    #php-version {
      padding: 2px 4px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: var(--bar);
      color: var(--bar-text);
      font: inherit;
    }
    #credentials { font-family: ui-monospace, Consolas, monospace; }
    .spacer { flex: 1; }

    .separator {
      width: 1px;
      align-self: stretch;
      background: var(--muted);
      opacity: 0.4;
    }

    #sites-menu { position: relative; }

    #sites-menu summary {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      list-style: none;
    }

    #sites-menu summary::-webkit-details-marker { display: none; }
    #sites-menu summary::after { content: " ▾"; }

    #sites-list {
      position: absolute;
      z-index: 10;
      top: calc(100% + 6px);
      left: 0;
      min-width: 320px;
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: var(--page);
      color: #1a1a1a;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    #sites-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 12px;
      padding: 6px 12px;
    }

    #sites-list li.empty { display: block; color: #666; }
    #sites-list a { color: #1a5fb4; font-weight: 600; }
    #sites-list .details { grid-column: 1; font-size: 12px; color: #666; }
    #sites-list .actions { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; }
    #sites-list button { color: #1a5fb4; border-color: #a7bfdc; }
    #sites-list button.delete { color: #a51d2d; border-color: #c6a0a6; }

    #mail-count:not(:empty) {
      margin-left: 4px;
      padding: 0 6px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bar);
      font-weight: 600;
    }

    #mail-dialog {
      width: min(1000px, calc(100vw - 32px));
      height: min(700px, calc(100vh - 64px));
      padding: 0;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
      color: #1a1a1a;
      background: var(--page);
    }

    #mail-dialog[open] { display: grid; grid-template-rows: auto 1fr; }
    #mail-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }

    #mail-dialog header { justify-content: space-between; }
    #mail-dialog .body { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; min-height: 0; }

    #mail-list {
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
      border-right: 1px solid #ddd;
    }

    #mail-list li { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    #mail-list li.selected { background: #e8f0fb; }
    #mail-list li.empty { color: #666; cursor: default; }
    #mail-list .subject { font-weight: 600; }
    #mail-list .meta { font-size: 12px; color: #666; }

    #mail-view { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    #mail-headers { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #eee; }
    #mail-headers dt { float: left; clear: left; width: 64px; color: #666; }
    #mail-headers dd { margin-left: 72px; }
    #mail-text { margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; }
    #mail-html { width: 100%; height: 100%; border: 0; }

    @media (max-width: 640px) {
      #mail-dialog .body { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
      #mail-list { border-right: 0; border-bottom: 1px solid #ddd; }
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Joomla Playground</h1>
    <button id="open-site" type="button" disabled>Site</button>
    <button id="open-admin" type="button" disabled>Administrator</button>
    <span class="separator"></span>
    <button id="new-site" type="button" disabled title="Start a new, empty playground">New</button>
    <button id="reset-site" type="button" disabled title="Throw this playground away and start again from the same link">Start over</button>
    <button id="save-site" type="button" disabled title="Keep this playground in your browser">Save…</button>
    <button id="export-site" type="button" disabled title="Download the whole site as a zip">Export</button>
    <button id="import-site" type="button" disabled title="Start a playground from an exported zip">Import…</button>
    <input id="import-file" type="file" accept=".zip,application/zip" hidden>
    <details id="sites-menu">
      <summary>My sites</summary>
      <ul id="sites-list"></ul>
    </details>
    <button id="mail" type="button" disabled title="The mails this site sent: they are caught, not delivered">Mail<span id="mail-count"></span></button>
    <span id="status">Loading</span>
    <span class="spacer"></span>
    <span><span id="credentials-label">Super User:</span> <span id="credentials">…</span></span>
    <label id="php-label">PHP <select id="php-version" disabled title="PHP version (WebAssembly)"></select></label>
    <span id="info"></span>
  </header>
  <iframe id="joomla" title="Joomla"></iframe>
  <dialog id="mail-dialog">
    <header>
      <h1>Mail sent by this playground</h1>
      <form method="dialog"><button type="submit">Close</button></form>
    </header>
    <div class="body">
      <ul id="mail-list"></ul>
      <div id="mail-view">
        <dl id="mail-headers"></dl>
        <pre id="mail-text"></pre>
      </div>
    </div>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
