<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joomla Playground</title>
  <style>
    :root {
      --bar: #1c2b4a;
      --bar-text: #f2f5fa;
      --muted: #b9c4d8;
      --accent: #f9a541;
      --error: #ff8a80;
      --page: #ffffff;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 8px 16px;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    header button {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      background: transparent;
      color: var(--bar-text);
      font: inherit;
      cursor: pointer;
    }

    header button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status { color: var(--accent); }
    #status.error { color: var(--error); white-space: pre-wrap; }
    #info, #credentials-label { color: var(--muted); }
    #credentials { font-family: ui-monospace, Consolas, monospace; }
    .spacer { flex: 1; }

    .separator {
      width: 1px;
      align-self: stretch;
      background: var(--muted);
      opacity: 0.4;
    }

    #sites-menu { position: relative; }

    #sites-menu summary {
      padding: 4px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      cursor: pointer;
      list-style: none;
    }

    #sites-menu summary::-webkit-details-marker { display: none; }
    #sites-menu summary::after { content: " ▾"; }

    #sites-list {
      position: absolute;
      z-index: 10;
      top: calc(100% + 6px);
      left: 0;
      min-width: 320px;
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: var(--page);
      color: #1a1a1a;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    #sites-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 12px;
      padding: 6px 12px;
    }

    #sites-list li.empty { display: block; color: #666; }
    #sites-list a { color: #1a5fb4; font-weight: 600; }
    #sites-list .details { grid-column: 1; font-size: 12px; color: #666; }
    #sites-list button { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: #a51d2d; border-color: #c6a0a6; }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Joomla Playground</h1>
    <button id="open-site" type="button" disabled>Site</button>
    <button id="open-admin" type="button" disabled>Administrator</button>
    <span class="separator"></span>
    <button id="new-site" type="button" disabled title="Start a new, empty playground">New</button>
    <button id="save-site" type="button" disabled title="Keep this playground in your browser">Save…</button>
    <button id="export-site" type="button" disabled title="Download the whole site as a zip">Export</button>
    <button id="import-site" type="button" disabled title="Start a playground from an exported zip">Import…</button>
    <input id="import-file" type="file" accept=".zip,application/zip" hidden>
    <details id="sites-menu">
      <summary>My sites</summary>
      <ul id="sites-list"></ul>
    </details>
    <span id="status">Loading</span>
    <span class="spacer"></span>
    <span><span id="credentials-label">Super User:</span> <span id="credentials">…</span></span>
    <span id="info"></span>
  </header>
  <iframe id="joomla" title="Joomla"></iframe>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
